<!DOCTYPE html>
<!-- Tells the browser that this is an HTML5 document -->

<html lang="en">
<!-- lang="en" tells search engines and browsers that the page is in English -->

<head>

    <meta charset="UTF-8">
    <!-- Supports most characters and symbols -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Makes the page responsive on mobile devices -->

    <title>Learn Web Development</title>
    <!-- SEO: Title of the webpage shown in search results and browser tab -->

    <meta name="description"
          content="Learn HTML, CSS and JavaScript.">
    <!-- SEO: Short description of the webpage -->

</head>

<body>

    <header>
        <!-- Semantic tag: represents the top/header part of the page -->

        <nav>
            <!-- Semantic tag: contains navigation links -->

            <a href="/">Home</a>
            <!-- Link to the homepage -->

            <a href="/courses">Courses</a>
            <!-- Link to the courses page -->

        </nav>
    </header>


    <main>
        <!-- Semantic tag: contains the main content of the page -->

        <h1>Learn Web Development</h1>
        <!-- Main heading: tells search engines the main topic of the page -->

        <section>
            <!-- Groups related content together -->

            <h2>HTML</h2>
            <!-- Subheading -->

            <p>HTML gives a webpage its structure.</p>
            <!-- Paragraph containing useful page content -->

            <img src="html.jpg"
                 width="600"
                 height="400"
                 alt="HTML code on a computer">
            <!-- alt: describes the image for accessibility and SEO -->
            <!-- width + height: reserve space and help prevent CLS -->
            
        </section>

    </main>


    <footer>
        <!-- Semantic tag: represents the bottom/footer part of the page -->

        <p>© 2026 WebDev</p>
        <!-- Footer content -->

    </footer>

</body>
</html>
