<!-- index.html -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>External CSS</title>

    <!-- Connect external CSS file -->
    <link rel="stylesheet" href="external.css">
</head>

<body>

    <!-- class="box" connects this element to .box in CSS -->
    <div class="box">
        <h1>This is a Box</h1>
        <p>This uses the box class.</p>
    </div>

    <!-- class="card" connects this element to .card in CSS -->
    <div class="card">
        <h1>This is a Card</h1>
        <p>This uses the card class.</p>
    </div>

</body>

</html>
